
model:
  input_size: 164              # 126 hands + 192 face + 27 pose (NPZ without confidence/visibility)
  hidden_size: 256
  num_layers: 2
  dropout: 0.3
  bidirectional: false
  num_attention_heads: 1
  use_attention: true
  max_sequence_length: 224
  max_annotation_length: 25
  use_ctc: false


training:
  batch_size: 8
  num_epochs: 50
  patience: 8
  gradient_clip_norm: 0.5

  train_split: 0.8
  random_seed: 42
  gradient_accumulation_steps: 1

  optimizer:
    name: adamw
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.98
    eps: 1.0e-8
    momentum: 0.9
    nesterov: false

  scheduler:
    name: lambda
    factor: 0.7
    patience: 8
    min_lr: 1.0e-6
    step_size: 10
    gamma: 0.7
    warmup_steps: 20
    total_steps: 200

  use_curriculum_learning: false
  curriculum_warmup_epochs: 5
  curriculum_stages: 4
  curriculum_overlap_ratio: 0.3


data:
  data_dir: "./data/phoenix_jsons/phoenix_dev"
  annotations_path: "./data/annotations_phoenix/dev_corpus.csv"
  vocab_path: "./vocab.pkl"
  model_save_path: "./models2/lstm_sign2gloss.pth"
  data_format: auto


preprocessing:
  max_sequence_length: 224
  min_sequence_length: 5
  padding_strategy: post
  include_hands: true
  include_face: false
  include_pose: true
  hand_landmarks_count: 21
  include_hand_confidence: true
  face_landmarks_count: 468
  use_face_subset: true
  pose_landmarks_count: 25
  include_pose_visibility: true
  normalize_coordinates: true   # note: this is ignored anyway (commented out in code)
  coordinate_range: [-1.0, 1.0]
  apply_augmentation: false
  rotation_range: 0.1
  scale_range: [0.9, 1.1]
  noise_std: 0.01
  interpolate_missing: true
  interpolation_method: linear
  max_missing_frames: 50
  output_format: tensor
  device: cpu

# Logging Configuration
logging:
  project_name: "sign-language-lstm-OLD-DEFAULTS-TEST"
  experiment_name: "lstm-old-defaults"
  tags:
    - lstm
    - old-defaults
    - test
  notes: "Testing with old hardcoded defaults from lstm_model_old.py"
  offline: false
  disabled: false
  log_every_n_steps: 10
  save_every_n_epochs: 1
  verbose: true
  debug: false

device: cpu