model:
  input_size: 306  # 153 raw (126 hand + 27 pose) doubled by delta feats
  hidden_size: 768
  num_layers: 1
  dropout: 0.2
  bidirectional: false
  num_attention_heads: 1
  use_attention: true
  max_annotation_length: 25
  use_ctc: true
training:
  batch_size: 32
  num_epochs: 50
  patience: 8
  gradient_clip_norm: 4.688003389907079
  train_split: 0.8
  random_seed: 42
  gradient_accumulation_steps: 1
  optimizer:
    name: adam
    learning_rate: 0.0003566917127653656
    weight_decay: 9.204635589147879e-06
    beta1: 0.9041901210930411
    beta2: 0.9847271258961003
    eps: 1.0e-08
    momentum: 0.9       # unused for adam
    nesterov: false     # unused for adam
  scheduler:
    name: cosine
    factor: 0.7         # unused, cosine branch ignores this
    patience: 8         # unused, cosine branch ignores this
    min_lr: 1.0e-06      # used as eta_min
    step_size: 10        # unused for cosine
    gamma: 0.7           # unused for cosine
    warmup_steps: 20     # unused for cosine
    total_steps: 200     # unused for cosine
  use_curriculum_learning: false
  curriculum_warmup_epochs: 5
  curriculum_stages: 4
  curriculum_overlap_ratio: 0.3
data:
  data_dir: data/phoenix_jsons/phoenix_train_aug_rndm
  annotations_path: data/annotations_phoenix/train_corpus_aug_rndm.csv
  vocab_path: ./models_stash/ctc-aug-wer-delta-optuna-best/vocab.pkl
  model_save_path: ./models_stash/ctc-aug-wer-delta-optuna-best/lstm_sign2gloss.pth
  config_save_path: models_stash/ctc-aug-wer-delta-optuna-best/config.yaml
  val_data_dir: data/phoenix_jsons/phoenix_dev
  val_annotations_path: data/annotations_phoenix/dev_corpus.csv
  data_format: auto
preprocessing:
  max_sequence_length: 224
  min_sequence_length: 5
  padding_strategy: post
  include_hands: true
  include_face: false
  include_pose: true
  hand_landmarks_count: 21
  include_hand_confidence: false
  face_landmarks_count: 468
  use_face_subset: true
