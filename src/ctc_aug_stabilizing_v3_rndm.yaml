model:
  input_size: 153
  hidden_size: 768
  num_layers: 3
  dropout: 0.4
  bidirectional: false
  num_attention_heads: 1
  use_attention: true
  max_annotation_length: 25
  use_ctc: true
training:
  batch_size: 4
  num_epochs: 100
  patience: 10
  gradient_clip_norm: 1.0
#  train_split: 0.8
  random_seed: 42
  gradient_accumulation_steps: 1
  optimizer:
    name: rmsprop
    learning_rate: 0.00012
    weight_decay: 5.197141152171896e-05
    beta1: 0.9
    beta2: 0.98
    eps: 1.0e-8
    momentum: 0.9
    nesterov: false
  scheduler:
    name: la
    factor: 0.7 # not used by lambda
    patience: 8 # not used by lambda
    min_lr: 1.0e-6 # not used by code
    step_size: 17 # not used by lambda
    gamma: 0.7528391483240343 # not used by lambda
    warmup_steps: 6000 # ~ 1 full epoch, before gradient has a chance to explode
    total_steps: 612000 # samples / batch size * epochs
  use_curriculum_learning: false
  curriculum_warmup_epochs: 5
  curriculum_stages: 4
  curriculum_overlap_ratio: 0.3
data:
  data_dir: data/phoenix_npz/phoenix_train_aug_rndm
  annotations_path: data/annotations_phoenix/train_corpus_aug_rndm.csv
  vocab_path: ./models_stash/ctc-aug-stabilising-v3_rndm/vocab.pkl
  model_save_path: ./models_stash/ctc-aug-stabilising-v3_rndm/lstm_sign2gloss.pth
  val_data_dir: data/phoenix_npz/phoenix_dev
  val_annotations_path: data/annotations_phoenix/dev_corpus.csv
  data_format: auto
preprocessing:
  max_sequence_length: 224
  min_sequence_length: 5
  padding_strategy: post
  include_hands: true
  include_face: false
  include_pose: true
  hand_landmarks_count: 21
  include_hand_confidence: false
  face_landmarks_count: 468
  use_face_subset: true
  pose_landmarks_count: 25
  include_pose_visibility: false
  normalize_coordinates: false
  coordinate_range: [-1.0, 1.0]
  apply_augmentation: false
  rotation_range: 0.1
  scale_range: [0.9, 1.1]
  noise_std: 0.01
  interpolate_missing: true
  interpolation_method: linear
  max_missing_frames: 50
  output_format: tensor
  device: cuda
processing:
  hand_min_detection_confidence: 0.7
  hand_min_tracking_confidence: 0.5
  face_confidence_threshold: 0.5
  face_temporal_smoothing_frames: 3
  pose_min_detection_confidence: 0.7
  hand_min_size: 0.05
  hand_max_size: 0.5
logging:
  project_name: sign-language-lstm
  experiment_name: ctc_aug_stabilizing_v3_rndm
  tags:
    - lstm
    - sign-language
    - ctc
    - optuna-best
  notes: ctc fix with lr=1e-3 hed exploding gradients and training isntability, trying to curb with lower lr, proper lambda scheduler, next step could be to increase gradclip too -> model is still converging, adding more epochs -> more augmented data, 9 rnadomly augmented files per sample
  offline: false
  disabled: false
  log_every_n_steps: 10
  save_every_n_epochs: 1
  verbose: true
  debug: false
device: cuda